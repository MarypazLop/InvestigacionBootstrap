<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Bootstrap — ISW-521</title>
  <link rel="stylesheet" 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="p-4">

  <h1 class="mb-4">Demo Bootstrap</h1>

  <!-- PARTE 1: Grilla responsiva -->
  <h2 class="mb-3">Sistema de Grilla</h2>
  <div class="container border">
    <div class="row g-2">
      <div class="col-12 col-md-4 bg-primary text-white p-3">Columna 1</div>
      <div class="col-12 col-md-4 bg-secondary text-white p-3">Columna 2</div>
      <div class="col-12 col-md-4 bg-success text-white p-3">Columna 3</div>
    </div>
  </div>

  <!-- PARTE 2: Modal -->
  <h2 class="mt-5 mb-3">Componente Interactivo</h2>
  <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#miModal">
    Abrir Modal
  </button>

  <div class="modal fade" id="miModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Modal de Bootstrap</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          Este componente funciona solo con atributos HTML. Sin JS propio.
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
